name: PPO
onpolicy: true
buffer_name: ReplayBuffer
trajnum: 10
critic_lr: 3e-4
actor_lr: 3e-4
lr_decay: false
optimizer: Adam
lambda_: 0.95
hidden_sizes: [64, 64]
state_dependent_std: false
initialize: false

advan_norm: true

collect_traj: false
gae: true
eps_clip: 0.2
value_coef: 0.25
use_entropy_loss: true
entropy_coef: 0.0
update_epochs: 10
minibatch_size: 64
use_grad_clip: true
max_grad_norm: 0.5

use_value_clip: true
value_clip: 0.2

rescale: false
action_bound_method: tanh
log_clip_stabilize: true
return_scaling: true

common_head: false
encoder_lr: 2.5e-4

recompute_adv: false