name: SAC
onpolicy: false
buffer_name: ReplayBuffer
buffer_size: 1000000
critic_lr: 3e-4
actor_lr: 3e-4
temp_lr: 3e-4
critic_optimizer: Adam
actor_optimizer: Adam
temp_optimizer: Adam

double_critic: true
use_target: true
target_update_method: soft
target_update_interval: 1
target_update_tau: 0.005
batch_size: 256


learn_temp: false
init_temp: 0.2
target_entropy: -1.0


hidden_sizes: [256, 256]
activation: relu


rescale: true
state_dependent_std: true
action_bound_method: tanh

update_log_temp: false